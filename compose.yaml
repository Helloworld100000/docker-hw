services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
       PORT: "8000"
       GREETING: "${GREETING:-Hello world}"
       STORAGE: "redis"
       REDIS_URL: "redis://redis:6379/0"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    read_only: true
    mem_limit: 256m
    cpus: 1
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  redis-data: